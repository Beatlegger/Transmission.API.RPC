name: Publish NuGet

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 4.0.0). Leave empty to use csproj default.'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore Transmission.API.RPC/Transmission.API.RPC.csproj

      - name: Build
        run: dotnet build Transmission.API.RPC/Transmission.API.RPC.csproj -c Release --no-restore ${{ steps.version.outputs.value && format('-p:Version={0}', steps.version.outputs.value) || '' }}

      - name: Pack
        run: dotnet pack Transmission.API.RPC/Transmission.API.RPC.csproj -c Release --no-build ${{ steps.version.outputs.value && format('-p:Version={0}', steps.version.outputs.value) || '' }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push Transmission.API.RPC/bin/Release/*.nupkg
          --api-key ${{ secrets.NUGET_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
